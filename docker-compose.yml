version: '3.7'

services:
  db:
      container_name: Oncoclinicas_MySQL
      image: mysql:5.7.13
      command: --default-authentication-plugin=mysql_native_password --sql_mode=NO_ENGINE_SUBSTITUTION,NO_AUTO_CREATE_USER --explicit_defaults_for_timestamp --init-file /data/application/create-database.sql
      restart: always
      ports: 
        - 3306:3306
      volumes:
          - ./backend/src/database/sql/create-database.sql:/data/application/create-database.sql
      environment:
        - MYSQL_ROOT_PASSWORD=secret
        - MYSQL_ROOT_HOST=%
        - TZ=America/Sao_Paulo
  
  frontend:
    build:
      dockerfile: Dockerfile
      context: ./frontend
    container_name: Oncoclinicas_APP
    command: yarn start
    ports: 
      - '3000:3000'
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
  
  backend: 
    build:
      dockerfile: Dockerfile
      context: ./backend
    container_name: Oncoclinicas_API
    command: yarn start
    restart: always
    ports: 
      - '3001:3001'
    volumes:
      - ./backend:/usr/app
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_PORT=${DATABASE_PORT}
  
  nginx:
    depends_on:
      - backend
      - frontend
    restart: always
    container_name: Oncoclinicas_NGINX
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "80:80"
  